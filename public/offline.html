<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1E3A6B" />
  <title>Dra. Marta Peciña — Sin conexión</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #FAF8F3; color: #2A2E33;
      min-height: 100vh; display: grid; place-items: center; padding: 2rem;
    }
    main { max-width: 34rem; text-align: center; }
    h1 { color: #1E3A6B; font-size: 1.75rem; margin-bottom: 1rem; font-weight: 600; }
    p { line-height: 1.7; margin-bottom: 1rem; }
    a {
      display: inline-block; margin-top: .5rem; padding: .8rem 1.6rem;
      background: #1E3A6B; color: #fff; border-radius: 999px; text-decoration: none;
    }
    .note { font-size: .85rem; color: #5b636e; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Sin conexión a internet</h1>
    <p>No se ha podido cargar la página porque no hay conexión. Comprueba tu conexión e inténtalo de nuevo.</p>
    <p lang="en" style="font-size:.9rem;color:#5b636e">You appear to be offline. Please check your connection and try again.</p>
    <a href="/">Reintentar · Retry</a>
    <p class="note">Esta consulta no es un servicio de urgencias. En España, llama al 112.</p>
  </main>
</body>
</html>
